<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 340px;
        margin: 0;
        padding: 12px;
        color: #222;
        background: #faf7f2;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      .links a {
        color: #7a5c2e;
        cursor: pointer;
        text-decoration: none;
        margin-left: 10px;
        font-size: 12px;
      }
      .links a:hover {
        text-decoration: underline;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 360px;
        overflow-y: auto;
      }
      li {
        border: 1px solid #e7ddcc;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 6px;
        background: #fff;
      }
      a.title {
        font-weight: 600;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #222;
        text-decoration: none;
      }
      a.title:hover {
        color: #7a5c2e;
        text-decoration: underline;
      }
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 4px;
        font-size: 11px;
        color: #777;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        text-transform: capitalize;
      }
      .pending { background: #efe6d4; color: #7a5c2e; }
      .running { background: #d7e6f5; color: #2a5a8a; }
      .success { background: #dcefe0; color: #2f6b3a; }
      .failed  { background: #f6dada; color: #a23b3b; }
      .err {
        color: #a23b3b;
        font-size: 11px;
        margin-top: 4px;
        word-break: break-word;
      }
      .row-actions a {
        color: #7a5c2e;
        cursor: pointer;
        margin-left: 8px;
      }
      .empty {
        color: #999;
        text-align: center;
        padding: 24px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>shelf enter</h1>
      <div class="links">
        <a id="clear">Clear finished</a>
        <a id="options">Settings</a>
      </div>
    </header>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden>No giveaways queued yet.<br />Open Goodreads giveaways and hit ⚡ Enter.</div>
    <script src="popup.js"></script>
  </body>
</html>
